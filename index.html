<html lang="en">

<style>
:root{--navy:#0B1F4B;--royal:#1D4ED8;--royal-d:#1E40AF;--sky:#EAF1FF;--bg:#FFFFFF;--surface:#F6F8FC;--line:#E3E8F2;--text:#0F1B33;--muted:#5B6784;--red:#B42318;--green:#067647;--amber:#B54708;--shadow:0 1px 2px rgba(11,31,75,.06),0 4px 14px rgba(11,31,75,.05)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Inter',system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text);background:var(--bg);line-height:1.5;font-size:15px;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;color:var(--navy);line-height:1.25}
h1{font-size:1.65rem;letter-spacing:-.02em}h3{font-size:1rem}p{margin:.35rem 0}
a{color:var(--royal);text-decoration:none}a:hover{text-decoration:underline}
i[data-lucide],svg.lucide{width:18px;height:18px;flex:none;vertical-align:-3px;margin-right:6px}
.muted{color:var(--muted)}.small{font-size:.82rem}
:focus-visible{outline:2px solid var(--royal);outline-offset:2px}
.btn{display:inline-flex;align-items:center;gap:2px;border:1px solid transparent;border-radius:8px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer;transition:background .15s,border-color .15s,transform .1s}
.btn:active{transform:scale(.98)}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--royal);color:#fff}.btn.primary:hover{background:var(--royal-d)}
.btn.ghost{background:#fff;border-color:var(--line);color:var(--navy)}.btn.ghost:hover:not(:disabled){background:var(--surface)}
.btn.danger{background:var(--red);color:#fff}.btn.sm{padding:5px 10px;font-size:.82rem}
.danger-text{color:var(--red)!important}
.icon-btn{position:relative;display:inline-grid;place-items:center;width:38px;height:38px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;color:var(--navy)}
.icon-btn i,.icon-btn svg{margin:0}.icon-btn:hover{background:var(--surface)}.icon-btn.sm{width:30px;height:30px}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:2px 10px;font-size:.74rem;font-weight:600;background:var(--sky);color:var(--royal);margin-left:8px}
.badge.High{background:#FEE4E2;color:var(--red);margin:0}.badge.Medium{background:#FEF0C7;color:var(--amber);margin:0}.badge.Low{background:#DCFAE6;color:var(--green);margin:0}.badge.soft{background:var(--surface);color:var(--muted);margin:0}
.tag{font-style:normal;font-size:.7rem;font-weight:600;background:var(--surface);border:1px solid var(--line);color:var(--muted);padding:1px 8px;border-radius:6px;margin-left:6px}
input,select,textarea{font:inherit;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--royal);outline-offset:-1px;border-color:var(--royal)}
.field{display:block;margin-bottom:14px}.field>span{display:block;font-weight:600;font-size:.84rem;margin-bottom:5px}
.field .invalid{border-color:var(--red)}.err{display:block;color:var(--red);font-size:.78rem;min-height:0;margin-top:3px}
.modal{position:fixed;inset:0;background:rgba(11,31,75,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal.open{display:flex}
.modal-card{background:#fff;border-radius:14px;padding:24px;width:100%;max-width:480px;max-height:90vh;overflow:auto;box-shadow:0 20px 50px rgba(11,31,75,.25);animation:pop .18s ease-out}
.modal-card h3{font-size:1.15rem;margin-bottom:14px}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:8px}
@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.toasts{position:fixed;right:16px;bottom:16px;display:grid;gap:8px;z-index:60}
.toast{background:var(--navy);color:#fff;padding:11px 16px;border-radius:10px;box-shadow:var(--shadow);font-weight:500;animation:pop .2s ease-out}
.toast.error{background:var(--red)}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:640px}
th{text-align:left;font-size:.78rem;color:var(--muted);font-weight:600;background:var(--surface);padding:10px 14px}
td{padding:12px 14px;border-top:1px solid var(--line);vertical-align:middle}
td.actions{white-space:nowrap;text-align:right}
.empty{text-align:center;padding:48px 16px;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}
.empty i,.empty svg{width:34px;height:34px;margin:0 0 8px;color:var(--royal)}.empty h3{margin-bottom:4px}
.skeleton{height:84px;border-radius:12px;margin-bottom:12px;background:linear-gradient(90deg,var(--surface),#EDF1F8,var(--surface));background-size:200% 100%;animation:sh 1s infinite linear}.skeleton.short{width:60%}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

</style>
<style>
body{display:flex;min-height:100vh}
.sidebar{width:248px;flex:none;background:var(--navy);color:#C9D6F2;padding:18px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;z-index:40}
.brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:700;font-size:1.15rem;padding:4px 8px 18px;letter-spacing:-.01em}.brand:hover{text-decoration:none}
#nav{display:grid;gap:2px}
#nav a{display:flex;align-items:center;color:#C9D6F2;padding:10px 12px;border-radius:8px;font-weight:500;transition:background .15s,color .15s}
#nav a:hover{background:rgba(255,255,255,.08);color:#fff;text-decoration:none}
#nav a.active{background:var(--royal);color:#fff}
.side-note{margin-top:auto;font-size:.76rem;color:#8EA2CF;padding:0 8px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 28px;border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:30}
.menu-btn{display:none}
.top-search{position:relative;flex:1;max-width:460px}
.search{position:relative;flex:1}.search>input{padding-left:38px}
.search>i,.search>svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);margin:0;color:var(--muted);pointer-events:none}
.date{margin-left:auto;color:var(--muted);font-size:.85rem;white-space:nowrap}
.dot{position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--red);border:2px solid #fff}
.role{display:flex;align-items:center;gap:8px;font-size:.78rem;color:var(--muted);font-weight:600}.role select{width:auto;padding:7px 10px}
.np-wrap{position:relative}
.panel{position:absolute;top:calc(100% + 8px);left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(11,31,75,.14);padding:6px;z-index:35}
.panel.right{left:auto;right:0;width:320px}
.panel[hidden]{display:none}
.panel h4{padding:8px 10px;font-size:.82rem;color:var(--muted)}
.panel button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:9px 10px;font:inherit;cursor:pointer;color:var(--text)}
.panel button:hover{background:var(--surface)}.panel small{margin-left:auto;color:var(--muted)}.panel .all{color:var(--royal);font-weight:600;border-top:1px solid var(--line);border-radius:0 0 8px 8px}.pad{padding:10px}
.banner{display:flex;gap:8px;align-items:center;background:var(--sky);color:var(--navy);font-size:.82rem;padding:8px 28px}.banner i,.banner svg{margin:0;color:var(--royal)}
main{padding:28px;max-width:1200px;width:100%}
main:focus{outline:none}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.toolbar{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}.toolbar select{width:auto;min-width:170px}.toolbar .search{min-width:220px}
.sec{font-size:1.05rem;margin:26px 0 12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:1.9rem;color:var(--navy);letter-spacing:-.02em;margin-top:4px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.quick button{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;font:inherit;font-weight:600;color:var(--navy);cursor:pointer;transition:border-color .15s,background .15s}
.quick button:hover{border-color:var(--royal);background:var(--sky)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:26px}
.card{border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--shadow)}
.card header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.card header a{font-size:.84rem;font-weight:600}
.card.narrow{max-width:640px;margin-bottom:16px}.card.narrow .btn{margin-top:10px}
.li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}.li:first-of-type{border-top:0}
.time{font-weight:600;color:var(--royal);font-size:.82rem;white-space:nowrap;min-width:64px}
.notice{border:1px solid var(--line);border-left:4px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px}
.notice.p-High{border-left-color:var(--red)}.notice.p-Medium{border-left-color:#F79009}.notice.p-Low{border-left-color:#12B76A}
.notice h3{margin:8px 0 2px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row.actions{margin-top:10px}
.notice-inline{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:.85rem;color:var(--muted)}.notice-inline i,.notice-inline svg{margin:0;color:var(--royal)}
.week{display:grid;grid-template-columns:repeat(6,minmax(150px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:150px}.day.today{border-color:var(--royal);background:#F3F7FF}
.day h3{margin-bottom:10px;font-size:.92rem}
.slot{display:grid;gap:2px;background:#fff;border:1px solid var(--line);border-left:3px solid var(--royal);border-radius:8px;padding:10px;margin-bottom:8px}
.slot .actions{margin-top:4px}
.event{display:flex;gap:16px;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.past .event{opacity:.7}
.date-chip{width:58px;height:62px;flex:none;background:var(--navy);color:#fff;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.date-chip b{font-size:1.4rem;line-height:1}.date-chip span{font-size:.72rem;margin-top:3px;color:#BFD0F5}
.dir{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.person{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:14px}.person .tag{margin-left:auto}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--sky);color:var(--royal);display:grid;place-items:center;font-weight:700;flex:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:8px}
.seg button{border:0;background:#fff;padding:9px 18px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer}.seg button.on{background:var(--royal);color:#fff}

/* refreshed look */
body,.main{background:#F5F8FF}
.sidebar{background:#fff;color:var(--muted);border-right:1px solid var(--line)}
.brand{color:var(--navy)}
#nav a{color:#41507A}#nav a:hover{background:var(--sky);color:var(--royal)}
#nav a.active{background:var(--sky);color:var(--royal);box-shadow:inset 3px 0 0 var(--royal)}
.side-note{color:var(--muted)}
.topbar{background:rgba(255,255,255,.92);backdrop-filter:blur(8px)}
.card,.stat,.notice,.event,.person,.day,.table-wrap,.quick button{background:#fff}
.card,.stat{border-radius:16px}.day.today{background:#F3F7FF}
.stat b{color:var(--royal)}.date-chip{background:var(--royal)}.date-chip span{color:#DCE7FF}
.hero{background:var(--royal);color:#fff;border-radius:18px;padding:26px 28px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.hero h1{color:#fff;font-size:1.7rem}.hero p{color:#DCE7FF;max-width:520px}
.hero-role{background:rgba(255,255,255,.16);padding:6px 14px;border-radius:999px;font-weight:600;font-size:.85rem}

</style>
<style>
@media (max-width:1100px){.stats,.quick{grid-template-columns:repeat(2,1fr)}.date{display:none}.role span{display:none}.week{grid-template-columns:repeat(6,200px)}}
@media (max-width:860px){
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .22s ease;box-shadow:0 0 40px rgba(0,0,0,.3)}
  body.nav-open .sidebar{transform:none}
  .scrim{display:none;position:fixed;inset:0;background:rgba(11,31,75,.45);z-index:35}body.nav-open .scrim{display:block}
  .menu-btn{display:inline-grid}.topbar{padding:10px 14px}.banner{padding:8px 14px}main{padding:18px 14px}
  .cols{grid-template-columns:1fr}.panel.right{position:fixed;left:12px;right:12px;top:64px;width:auto}
}
@media (max-width:560px){
  h1{font-size:1.35rem}.stats,.quick{grid-template-columns:1fr 1fr;gap:10px}.stat b{font-size:1.5rem}
  .toolbar select,.toolbar .search{width:100%;flex:1 1 100%}.event{flex-direction:column;gap:10px}
  .modal-card{padding:18px}.toasts{left:12px;right:12px}.banner span{font-size:.76rem}
}

</style>

<body>
<aside class="sidebar" id="sidebar">
  <a class="brand" href="#overview"><img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMiAzMiI+PHJlY3Qgd2lkdGg9IjMyIiBoZWlnaHQ9IjMyIiByeD0iOCIgZmlsbD0iIzBCMUY0QiIvPjxwYXRoIGQ9Ik0xNiA3IDQgMTNsMTIgNiA5LTQuNVYyMWgydi04eiIgZmlsbD0iI2ZmZiIvPjxwYXRoIGQ9Ik05IDE3djRjMCAyIDMuMSA0IDcgNHM3LTIgNy00di00bC03IDMuNXoiIGZpbGw9IiM2MEE1RkEiLz48L3N2Zz4K" alt="" width="32" height="32"><span>CampusOne</span></a>
  <nav id="nav" aria-label="Main"></nav>
  <p class="side-note">Lamrin Tech Skills University</p>
</aside>
<div class="scrim" id="scrim"></div>
<div class="main">
  <header class="topbar">
    <button class="icon-btn menu-btn" id="menu" aria-label="Open menu"><i data-lucide="menu"></i></button>
    <div class="search top-search"><i data-lucide="search"></i><input id="gs" type="search" placeholder="Search notices, events, resources, people" autocomplete="off"><div class="panel" id="sp" hidden></div></div>
    <span class="date" id="date"></span>
    <div class="np-wrap"><button class="icon-btn" id="bell" aria-label="Notifications"><i data-lucide="bell"></i><span class="dot" id="dot"></span></button><div class="panel right" id="np" hidden></div></div>
    <label class="role"><span>View as</span><select id="role" title="Choose how you want to view CampusOne"></select></label>
  </header>
  <main id="view" tabindex="-1"></main>
</div>
<div class="modal" id="modal"><div class="modal-card" role="dialog" aria-modal="true"></div></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script>
/* CampusOne core: storage, seed data, modal/form/toast helpers */
window.CO = { views: {}, add: {} };
(function () {
  const P = 'campusone_';
  CO.load = (k, d) => { try { const v = localStorage.getItem(P + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } };
  CO.save = (k, v) => { try { localStorage.setItem(P + k, JSON.stringify(v)); return true; } catch (e) { CO.toast('Browser storage is full or unavailable.', 'error'); return false; } };
  CO.uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  CO.esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const iso = d => new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
  const day = n => { const d = new Date(); d.setDate(d.getDate() + n); return iso(d); };
  CO.today = () => iso(new Date());
  CO.todayName = () => ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'][new Date().getDay()];
  CO.fmtDate = s => new Date(s + 'T00:00').toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
  CO.fmtTime = t => { const [h, m] = t.split(':').map(Number); return ((h % 12) || 12) + ':' + String(m).padStart(2, '0') + (h < 12 ? ' AM' : ' PM'); };
  CO.can = () => CO.role !== 'Student';
  CO.SUBJECTS = ['Applied Mathematics', 'OOP in C++', 'Computational Thinking', 'Basic Electrical & Electronics', 'English & Communication Skills'];
  CO.SEMS = [1, 2, 3, 4, 5, 6, 7, 8].map(n => 'Semester ' + n);

  CO.init = () => {
    if (CO.load('ver', 0) < 2) {
      Object.keys(localStorage).filter(k => k.startsWith(P) && k !== P + 'role').forEach(k => localStorage.removeItem(k));
      ['notices', 'timetable', 'events', 'resources', 'students', 'faculty'].forEach(k => CO.save(k, []));
      CO.save('ver', 2);
    }
  };
  CO.reset = async () => {
    Object.keys(localStorage).filter(k => k.startsWith(P) && k !== P + 'role').forEach(k => localStorage.removeItem(k));
    try { await CO.db.clear(); } catch (e) { }
    CO.init();
  };

  const open = () => new Promise((res, rej) => { const r = indexedDB.open('campusone-files', 1); r.onupgradeneeded = () => r.result.createObjectStore('files', { keyPath: 'id' }); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const tx = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => { const t = db.transaction('files', mode); const rq = fn(t.objectStore('files')); t.oncomplete = () => res(rq && rq.result); t.onerror = () => rej(t.error); }); };
  CO.db = { put: (id, blob) => tx('readwrite', s => s.put({ id, blob })), get: id => tx('readonly', s => s.get(id)), del: id => tx('readwrite', s => s.delete(id)), clear: () => tx('readwrite', s => s.clear()) };

  CO.toast = (msg, type = 'success') => {
    const t = document.createElement('div'); t.className = 'toast ' + type; t.setAttribute('role', type === 'error' ? 'alert' : 'status'); t.textContent = msg;
    document.getElementById('toasts').appendChild(t); setTimeout(() => t.remove(), 3500);
  };
  CO.openModal = html => { const m = document.getElementById('modal'); m.querySelector('.modal-card').innerHTML = html; m.classList.add('open'); };
  CO.closeModal = () => document.getElementById('modal').classList.remove('open');
  document.addEventListener('click', e => { if (e.target.id === 'modal' || e.target.closest('[data-close]')) CO.closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') CO.closeModal(); });
  CO.confirm = (msg, onYes, label = 'Delete') => {
    CO.openModal(`<h3>Please confirm</h3><p>${msg}</p><div class="modal-actions"><button class="btn ghost" data-close>Cancel</button><button class="btn danger" id="yes">${label}</button></div>`);
    document.getElementById('yes').onclick = async () => { await onYes(); CO.closeModal(); };
  };
  CO.form = ({ title, fields, values = {}, submit = 'Save', note = '', onSave }) => {
    const inputs = fields.map(f => {
      const v = values[f.name] == null ? '' : values[f.name]; let inp;
      if (f.type === 'select') inp = `<select name="${f.name}">${f.options.map(o => `<option ${o == v ? 'selected' : ''}>${CO.esc(o)}</option>`).join('')}</select>`;
      else if (f.type === 'textarea') inp = `<textarea name="${f.name}" rows="3">${CO.esc(v)}</textarea>`;
      else inp = `<input name="${f.name}" type="${f.type || 'text'}" ${f.accept ? `accept="${f.accept}"` : ''} value="${f.type === 'file' ? '' : CO.esc(v)}">`;
      return `<label class="field"><span>${f.label}${f.required ? ' *' : ''}</span>${inp}<small class="err"></small></label>`;
    }).join('');
    CO.openModal(`<h3>${title}</h3>${note ? `<p class="muted small">${note}</p>` : ''}<form novalidate>${inputs}<div class="modal-actions"><button type="button" class="btn ghost" data-close>Cancel</button><button class="btn primary">${submit}</button></div></form>`);
    const f = document.querySelector('#modal form');
    f.addEventListener('submit', async e => {
      e.preventDefault(); let ok = true; const data = {};
      fields.forEach(fl => { const el = f.elements[fl.name]; data[fl.name] = fl.type === 'file' ? el.files[0] : el.value.trim(); });
      fields.forEach(fl => {
        const el = f.elements[fl.name], v = data[fl.name]; let m = '';
        if (fl.required && !v) m = 'This field is required.'; else if (fl.validate && v) m = fl.validate(v, data) || '';
        el.parentElement.querySelector('.err').textContent = m; el.classList.toggle('invalid', !!m); if (m) ok = false;
      });
      if (ok && (await onSave(data)) !== false) CO.closeModal();
    });
    const first = f.querySelector('input,select,textarea'); if (first) first.focus();
  };
})();

</script>

(function () {

  function upload() {
    CO.form({
      title: 'Upload resource', submit: 'Upload', note: 'Stored in this browser only. Allowed: PDF, DOC, DOCX, PPT, PPTX, TXT up to 10 MB.',
      values: { subject: CO.SUBJECTS[0], semester: CO.SEMS[0] },
      fields: [
        { name: 'file', label: 'File', type: 'file', accept: '.pdf,.doc,.docx,.ppt,.pptx,.txt', required: true, validate: f => !OK.includes(f.name.split('.').pop().toLowerCase()) ? 'This file type is not allowed.' : f.size > MAX ? 'File is larger than 10 MB.' : '' },
        { name: 'title', label: 'Title', required: true, validate: v => v.length < 3 ? 'Use at least 3 characters.' : '' },
        { name: 'subject', label: 'Subject', type: 'select', options: CO.SUBJECTS, required: true },
        { name: 'semester', label: 'Semester', type: 'select', options: CO.SEMS, required: true }
      ],

        const id = CO.uid();
        try { await CO.db.put(id, d.file); } catch (e) { CO.toast('Could not store the file in this browser.', 'error'); return false; }
        const l = CO.load('resources', []);

      }
    });
  }
  CO.add.resource = upload;
  async function download(id) {
    const r = CO.load('resources', []).find(x => x.id === id);
    let rec; try { rec = await CO.db.get(id); } catch (e) { }
    if (!rec) { CO.toast('No file is stored for this entry.', 'error'); return; }
    const u = URL.createObjectURL(rec.blob), a = document.createElement('a'); a.href = u; a.download = r.fileName; a.click(); setTimeout(() => URL.revokeObjectURL(u), 1000);
  }
  CO.views.resources = el => {

    const list = () => {
      const t = q.s.toLowerCase();
      const items = CO.load('resources', []).filter(r => (q.sub === 'All' || r.subject === q.sub) && (q.sem === 'All' || r.semester === q.sem) && (r.title + r.fileName).toLowerCase().includes(t)).sort((a, b) => b.date.localeCompare(a.date));
      document.getElementById('rl').innerHTML = items.length ? `<div class="table-wrap"><table><thead><tr><th>Title</th><th>Subject</th><th>Semester</th><th>Uploaded</th><th>Size</th><th></th></tr></thead><tbody>${items.map(r => `<tr>
        <td><strong>${CO.esc(r.title)}</strong><div class="muted small">${CO.esc(r.fileName)}</div></td><td>${CO.esc(r.subject)}</td><td>${r.semester}</td><td>${CO.fmtDate(r.date)}</td><td>${size(r.size)}</td>
        <td class="actions"><button class="btn ghost sm" data-dl="${r.id}" ${r.hasFile ? '' : 'disabled'}><i data-lucide="download"></i>Download</button>${CO.can() ? `<button class="icon-btn sm danger-text" aria-label="Delete" data-del="${r.id}"><i data-lucide="trash-2"></i></button>` : ''}</td></tr>`).join('')}</tbody></table></div>`
        : CO.empty('folder-open', 'No resources found', q.s || q.sub !== 'All' || q.sem !== 'All' ? 'Try changing the search or filters.' : 'Uploaded files will appear here.');

<script>
/* CampusOne app shell: routing, overview, directories, settings, search */
(function () {
  const NAV = [['overview', 'Overview', 'layout-dashboard'], ['notices', 'Notice Board', 'megaphone'], ['timetable', 'Timetable', 'calendar-days'], ['resources', 'Study Resources', 'library'],
    ['events', 'Campus Events', 'calendar-check'], ['students', 'Student Information', 'graduation-cap'], ['faculty', 'Faculty Information', 'users'], ['settings', 'Settings', 'settings']];
  const ROLES = ['Student', 'Faculty', 'Admin'], $ = id => document.getElementById(id);

  CO.icons = () => window.lucide && lucide.createIcons();

  const route = () => { const h = location.hash.slice(1); return NAV.some(n => n[0] === h) ? h : 'overview'; };
  let token = 0;
  function render(instant) {
    const v = route(), el = $('view'), my = ++token;
    $('nav').innerHTML = NAV.map(n => `<a href="#${n[0]}" class="${n[0] === v ? 'active' : ''}" ${n[0] === v ? 'aria-current="page"' : ''}><i data-lucide="${n[2]}"></i>${n[1]}</a>`).join('');
    document.title = NAV.find(n => n[0] === v)[1] + ' | CampusOne';
    const run = () => { if (my !== token) return; el.onclick = null; CO.views[v](el); CO.icons(); };
    if (instant) run(); else { el.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton short"></div>'; setTimeout(run, 160); }
    CO.icons(); document.body.classList.remove('nav-open');
    $('dot').hidden = !CO.load('notices', []).some(n => n.priority === 'High');

  window.addEventListener('hashchange', () => render(false));

    const was = !$('np').hidden; hide(); if (was) return;

      <h2 class="sec">Quick access</h2><div class="quick">${quick.map(q => CO.add[q[0]] ? `<button data-add="${q[0]}"><i data-lucide="${q[1]}"></i>${q[2]}</button>` : `<button data-go="${q[0]}"><i data-lucide="${q[1]}"></i>${q[2]}</button>`).join('')}</div>
      <div class="cols">
        <section class="card"><header><h3>Latest announcements</h3><a href="#notices">View all</a></header>${li(notices, n => `<div class="li"><span class="badge ${n.priority}">${n.priority}</span><div><b>${CO.esc(n.title)}</b><div class="muted small">${n.category} on ${CO.fmtDate(n.date)}</div></div></div>`, 'No notices yet.')}</section>
        <section class="card"><header><h3>Today's timetable <span class="muted small">${CO.todayName()}</span></h3><a href="#timetable">Full week</a></header>${li(slots, t => `<div class="li"><span class="time">${CO.fmtTime(t.start)}</span><div><b>${CO.esc(t.subject)}</b><div class="muted small">${CO.esc(t.faculty)}, ${CO.esc(t.room)}</div></div></div>`, 'No classes scheduled today.')}</section>
        <section class="card"><header><h3>Upcoming events</h3><a href="#events">View all</a></header>${li(events, e => `<div class="li"><span class="time">${CO.fmtDate(e.date).replace(/ \d{4}$/, '')}</span><div><b>${CO.esc(e.title)}</b><div class="muted small">${CO.esc(e.venue)}, ${CO.fmtTime(e.time)}</div></div></div>`, 'No upcoming events.')}</section>
        <section class="card"><header><h3>Recent resources</h3><a href="#resources">View all</a></header>${li(res, r => `<div class="li"><i data-lucide="file-text"></i><div><b>${CO.esc(r.title)}</b><div class="muted small">${CO.esc(r.subject)}, ${r.semester}</div></div></div>`, 'No resources uploaded yet.')}</section>
      </div>`;
  };

  /* student and faculty directories */
  const dq = { students: { s: '', d: 'All' }, faculty: { s: '', d: 'All' } };
  const DEPTS = ['CSE', 'ECE', 'Mechanical', 'Civil', 'Management', 'Mathematics', 'English', 'Other'];
  function editPerson(kind, id) {
    const cur = CO.load(kind, []).find(x => x.id === id), st = kind === 'students', word = st ? 'student' : 'faculty member';
    CO.form({
      title: (cur ? 'Edit ' : 'Add ') + word, submit: cur ? 'Save changes' : 'Add ' + word, values: cur || { dept: 'CSE', sem: 'Semester 1' },
      fields: [
        { name: 'name', label: 'Full name', required: true, validate: v => v.length < 3 ? 'Use at least 3 characters.' : '' },
        { name: 'dept', label: 'Department', type: 'select', options: DEPTS, required: true },
        st ? { name: 'sem', label: 'Semester', type: 'select', options: CO.SEMS, required: true } : { name: 'role', label: 'Designation', required: true },
        st ? { name: 'rollNo', label: 'Roll number', required: true } : { name: 'area', label: 'Subject or specialization', required: true }
      ],
      onSave: d => {
        const l = CO.load(kind, []);
        if (cur) Object.assign(l.find(x => x.id === id), d); else l.push({ id: CO.uid(), ...d });
        if (CO.save(kind, l)) { CO.toast(cur ? 'Details updated' : 'Added to directory'); CO.refresh(); } else return false;
      }
    });
  }
  CO.add.student = () => editPerson('students'); CO.add.faculty = () => editPerson('faculty');
  ['students', 'faculty'].forEach(kind => {
    CO.views[kind] = el => {
      const st = kind === 'students', data = CO.load(kind, []), q = dq[kind], depts = ['All', ...new Set(data.map(x => x.dept))];
      el.innerHTML = CO.head(st ? 'Student Information' : 'Faculty Information', st ? 'Student directory.' : 'Faculty directory.', CO.can() ? `<button class="btn primary" id="add"><i data-lucide="user-plus"></i>Add ${st ? 'student' : 'faculty member'}</button>` : '') +
        `<div class="toolbar"><div class="search"><i data-lucide="search"></i><input id="ds" type="search" placeholder="Search by name" value="${CO.esc(q.s)}"></div>
        <select id="dd" aria-label="Department">${depts.map(d => `<option value="${d}" ${d === q.d ? 'selected' : ''}>${d === 'All' ? 'All departments' : d}</option>`).join('')}</select></div><div id="dl"></div>`;
      const list = () => {
        const r = data.filter(x => (q.d === 'All' || x.dept === q.d) && x.name.toLowerCase().includes(q.s.toLowerCase())).sort((a, b) => a.name.localeCompare(b.name));
        $('dl').innerHTML = r.length ? `<div class="dir">${r.map(x => `<div class="person"><span class="avatar">${CO.esc(x.name.replace(/^(Dr\.|Prof\.) /, '').split(' ').map(w => w[0]).join('').slice(0, 2))}</span><div><b>${CO.esc(x.name)}</b>
          <div class="muted small">${CO.esc(x.dept)}, ${CO.esc(st ? x.sem : x.role)}</div><div class="muted small">${st ? 'Roll no. ' + CO.esc(x.rollNo) : 'Subject: ' + CO.esc(x.area)}</div></div>
          ${CO.can() ? `<span class="row actions"><button class="icon-btn sm" aria-label="Edit" data-edit="${x.id}"><i data-lucide="pencil"></i></button><button class="icon-btn sm danger-text" aria-label="Delete" data-del="${x.id}"><i data-lucide="trash-2"></i></button></span>` : ''}</div>`).join('')}</div>`
          : CO.empty(st ? 'graduation-cap' : 'users', data.length ? 'No matches found' : `No ${st ? 'students' : 'faculty'} added yet`, data.length ? 'Try a different name or department.' : CO.can() ? 'Use the add button to start the directory.' : 'Records will appear here once added.');
        CO.icons();
      };
      list();
      $('ds').oninput = e => { q.s = e.target.value; list(); };
      $('dd').onchange = e => { q.d = e.target.value; list(); };
      const add = $('add'); if (add) add.onclick = () => editPerson(kind);
      $('dl').onclick = e => {
        const b = e.target.closest('button'); if (!b) return;
        if (b.dataset.edit) editPerson(kind, b.dataset.edit);
        if (b.dataset.del) CO.confirm('Remove this record from the directory?', () => { CO.save(kind, CO.load(kind, []).filter(x => x.id !== b.dataset.del)); CO.toast('Record removed'); CO.refresh(); }, 'Remove');
      };
    };
  });

  /* settings */
  CO.views.settings = el => {
    el.innerHTML = CO.head('Settings', 'Preferences for this browser.') +
      `<section class="card narrow"><h3>View as</h3><p class="muted small">Students can view everything. Faculty and Admin can also add, edit and delete records.</p>
        <div class="seg" id="seg">${ROLES.map(r => `<button class="${r === CO.role ? 'on' : ''}" data-r="${r}">${r}</button>`).join('')}</div></section>
      <section class="card narrow"><h3>Data</h3><p class="muted small">Everything you add is saved in this browser only. Clearing removes all notices, classes, events, resources and directory records.</p>
        <button class="btn danger" id="reset"><i data-lucide="trash-2"></i>Clear all data</button></section>`;
    $('seg').onclick = e => { const b = e.target.closest('button'); if (b) { $('role').value = b.dataset.r; $('role').onchange({ target: $('role') }); } };
    $('reset').onclick = () => CO.confirm('Clear all data and uploaded files? This cannot be undone.', async () => { await CO.reset(); CO.toast('All data cleared'); render(true); }, 'Clear data');
  };
  render(false);
})();

</script>
</body>
</html>
